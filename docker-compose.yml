services:
  postgres:
    image: postgres:16-alpine
    container_name: codeatlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeatlas_secret}
      POSTGRES_DB: ${POSTGRES_DB:-codeatlas_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codeatlas} -d ${POSTGRES_DB:-codeatlas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codeatlas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codeatlas-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: codeatlas-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-codeatlas}:${POSTGRES_PASSWORD:-codeatlas_secret}@postgres:5432/${POSTGRES_DB:-codeatlas_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-codeatlas}:${POSTGRES_PASSWORD:-codeatlas_secret}@postgres:5432/${POSTGRES_DB:-codeatlas_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - SECRET_KEY=${SECRET_KEY:-change-this-to-a-secure-random-string-in-production}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-gemini}
      - RERANKER_PROVIDER=${RERANKER_PROVIDER:-mock}
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./workers:/app/workers
      - ./tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
    container_name: codeatlas-worker
    restart: unless-stopped
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./workers:/app/workers
      - ./tests:/app/tests
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-codeatlas}:${POSTGRES_PASSWORD:-codeatlas_secret}@postgres:5432/${POSTGRES_DB:-codeatlas_db}
      - DATABASE_SYNC_URL=postgresql://${POSTGRES_USER:-codeatlas}:${POSTGRES_PASSWORD:-codeatlas_secret}@postgres:5432/${POSTGRES_DB:-codeatlas_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    container_name: codeatlas-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:latest
    container_name: codeatlas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:latest
    container_name: codeatlas-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false

volumes:
  pgdata:
  redisdata:
  qdrant_data:
  prometheus_data:
  grafana_data:
