name: CodeAtlas CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-lint-and-test:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codeatlas
          POSTGRES_PASSWORD: codeatlas_secret
          POSTGRES_DB: codeatlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio httpx flake8 black

      - name: Lint with Flake8 & Black
        run: |
          black --check apps/api packages tests
          flake8 apps/api packages tests --count --max-line-length=120 --statistics

      - name: Run Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://codeatlas:codeatlas_secret@localhost:5432/codeatlas_test
          DATABASE_SYNC_URL: postgresql://codeatlas:codeatlas_secret@localhost:5432/codeatlas_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-minimum-32-chars-long
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: mock
          RERANKER_PROVIDER: mock
        run: |
          pytest tests/unit tests/integration -v --durations=10

  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Lint and Typecheck
        working-directory: apps/web
        run: |
          npm run lint
          npm run typecheck

      - name: Build Next.js
        working-directory: apps/web
        run: npm run build
